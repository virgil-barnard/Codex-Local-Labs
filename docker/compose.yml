version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    env_file:
      - ./profiles/ollama.env
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_models:/root/.ollama

  vllm:
    profiles: ["vllm"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.vllm
    restart: unless-stopped
    env_file:
      - ./profiles/vllm.env
    environment:
      - VLLM_HOST=0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile.runner
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    env_file:
      - ./profiles/ollama.env
      - ./profiles/vllm.env
    environment:
      - CODEX_CONFIG_TEMPLATE=/workspace/codex/config.template.toml
    volumes:
      - ..:/workspace
    working_dir: /workspace
    entrypoint: ["/bin/bash", "-lc"]
    command: ["tail", "-f", "/dev/null"]

volumes:
  ollama_models:
  vllm_cache:
