[project]
name = "codex-local-labs"
version = "0.1.0"
description = "Local benchmarking harness for OpenAI Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "S",
  "RUF100",
]
ignore = [
  "S101",
]

[tool.ruff.lint.isort]
known-first-party = ["codex_local_labs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = [
  "bench",
]
pythonpath = [
  ".",
]

[tool.coverage.run]
branch = true
source = [
  "bench",
  "scripts",
]
omit = [
  "bench/hfi/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
precision = 1
